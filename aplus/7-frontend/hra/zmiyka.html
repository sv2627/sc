<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змійка</title>

<!-- ═══════════════════════════════════════════════════════════════════

     Збережи цей файл собі, перейменуй і переробляй під себе.
     Усе, що треба міняти, позначено словом МІНЯЙ.
     ═══════════════════════════════════════════════════════════════════ -->

<style>
/* ─── МІНЯЙ: це звичайний CSS, який ти вже вмієш ─────────────────── */
body {
  font-family: 'Trebuchet MS', sans-serif;
  background: #0d1117;
  color: #e6edf3;
  margin: 0;
  padding: 30px 16px;
  text-align: center;
}
h1 {
  font-size: 2.4rem;
  margin: 0 0 6px;
  color: #00e676;
}
p.підпис {
  color: #8b949e;
  margin: 0 0 24px;
}
#game {
  display: inline-block;
  border: 4px solid #00e676;
  border-radius: 14px;
  overflow: hidden;
}
#табло {
  margin-top: 18px;
  font-size: 1.3rem;
}
</style>
</head>
<body>

  <!-- ─── МІНЯЙ: заголовок і підпис ─────────────────────────────── -->
  <h1>Змійка Олександра</h1>
  <p class="підпис">Стрілки — керувати · пробіл — почати заново</p>

  <!-- Сюди рушій поставить гру. Цей рядок не чіпай. -->
  <div id="game"></div>

  <p id="табло">Зібрано яблук: <b>0</b></p>

  <!-- Підключаємо рушій. Цей рядок не чіпай. -->
  <script src="gra.js"></script>

  <script>
    // ─── МІНЯЙ: тут описана вся твоя гра ──────────────────────────
    Game.snake({
      field: 20,                 // клітинок по стороні поля
      cell: 24,                  // розмір однієї клітинки, пікселів
      speed: 150,                // мілісекунд на крок: менше число — швидше
      bgColor: '#101418',
      snakeColor: '#00e676',
      headColor: '#b9f6ca',      // голова світліша за тіло
      food: '🍎',                // будь-яке емодзі; прибереш — буде квадрат
      foodColor: '#ff5252',      // колір квадрата, якщо емодзі прибрано
      wrapWalls: false,          // true — змійка виповзає з іншого боку

      // Спрацьовує на початку і після кожного перезапуску пробілом
      onStart: function () {
        document.getElementById('табло').innerHTML = 'Зібрано яблук: <b>0</b>';
      },

      // Спрацьовує щоразу, коли змійка з'їла яблуко
      onScore: function (score) {
        document.getElementById('табло').innerHTML =
          'Зібрано яблук: <b>' + score + '</b>';
      },

      // Спрацьовує, коли гра закінчилась
      onGameOver: function (score) {
        document.getElementById('табло').innerHTML =
          'Гру закінчено. Яблук: <b>' + score + '</b>';
      }
    });
  </script>

</body>
</html>
