<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Урок 1. Вступне заняття. Як влаштована вебсторінка · Front-end 7 клас</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,900&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══ ПАЛІТРА РЕСПУБЛІКА СТЕМ — світла, кольори з respublika.school ═══
   #591429 бордовий (герой і заголовки, той самий холдинг A+) · #282a29 текст
   #227354 зелений · #f2c75c золотий (тільки заливка) · #ffffff / #f7f8fa фон
   ШКОЛИ РІЗНИТЬ ТИПОГРАФІКА, не колір: Республіка — серифна (Source Serif),
   A+ — Montserrat. Колір бренду в обох однаковий, бо холдинг один.
   КОНТРАСТ: основний текст ≥7:1, вторинний ≥4.5:1.
   --gold — ТІЛЬКИ заливки й рамки, ніколи не текст. */
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surf2:#f1f3f7; --border:#e0e3e9;
  --brand:#591429; --green:#227354; --forest:#154734; --gold:#f2c75c;
  --goldink:#8a5a10; --brick:#a8392f; --steel:#3c5a72;
  --ink:#282a29; --dim:#5c605e; --faint:#84888a;
  --accent:var(--brand);
  --f-head:'Source Serif 4','Meta Serif Pro',Georgia,'Times New Roman',serif;
  --f-body:'Source Sans 3','Source Sans Pro','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-ser:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-mono:'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);font-size:18px;background:var(--bg);color:var(--ink);
min-height:100vh;padding:34px 26px 60px;line-height:1.6}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
background-image:linear-gradient(rgba(40,42,41,.045) 1px,transparent 1px),
linear-gradient(90deg,rgba(40,42,41,.045) 1px,transparent 1px);background-size:44px 44px}
.wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}
a{color:inherit;text-decoration:none}
.crumb{font-size:16px;color:var(--dim);margin-bottom:22px;display:flex;
flex-wrap:wrap;align-items:center;gap:9px}
.crumb a{color:var(--dim);border-bottom:1px solid transparent;padding:10px 0}
.crumb a:hover{color:var(--accent);border-color:var(--accent)}
.crumb .sep{color:#b9bec6}
h1{font-family:var(--f-head);font-weight:900;font-size:2.6rem;letter-spacing:-.5px;
color:var(--accent);line-height:1.12;margin-bottom:10px}
.lead{font-size:19px;color:var(--dim);margin-bottom:32px;max-width:760px}
.kicker{font-family:var(--f-mono);font-size:13px;letter-spacing:1.6px;text-transform:uppercase;
color:var(--faint);margin-bottom:9px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
padding:24px 26px;display:block;box-shadow:0 1px 3px rgba(40,42,41,.06);
transition:border-color .18s,background .18s,transform .18s,box-shadow .18s}
a.card:hover{border-color:var(--accent);background:var(--surf2);transform:translateY(-2px);
box-shadow:0 4px 12px rgba(40,42,41,.10)}
.card.off{background:var(--surf2);box-shadow:none}
.card.off h2{color:var(--dim)!important}
.card.off p{color:var(--dim)}
.card .k{font-family:var(--f-mono);font-size:12px;letter-spacing:1.6px;text-transform:uppercase;
color:var(--faint);display:block;margin-bottom:9px}
.card h2{font-family:var(--f-head);font-size:1.5rem;font-weight:800;margin-bottom:7px;line-height:1.2}
.card p{font-size:16.5px;color:var(--dim)}
.card .meta{margin-top:13px;font-size:15px;color:var(--faint)}
.badge{display:inline-block;font-family:var(--f-mono);font-size:12px;letter-spacing:1px;
text-transform:uppercase;padding:5px 12px;border-radius:20px}
.b-ready{background:var(--sky);color:var(--blue)}
.b-soon{background:#eceef2;color:var(--dim)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:16px;background:var(--surface);
border:1px solid var(--border);border-radius:12px;padding:14px 18px;min-height:56px;
box-shadow:0 1px 3px rgba(40,42,41,.06);transition:border-color .18s,background .18s,box-shadow .18s}
a.row:hover{border-color:var(--accent);background:var(--surf2);
box-shadow:0 3px 10px rgba(40,42,41,.09)}
.row.off{background:var(--surf2);box-shadow:none}
.row.off .rt{color:var(--dim)}
.rn{font-family:var(--f-mono);font-size:15px;color:var(--accent);min-width:38px;font-weight:700}
.row.off .rn{color:var(--faint)}
.rt{flex:1;font-size:17.5px}
.rd{font-family:var(--f-mono);font-size:14.5px;color:var(--dim);flex-shrink:0}
.res{font-family:var(--f-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;
color:var(--dim);background:var(--bg);border:1px solid var(--gold);
padding:3px 9px;border-radius:20px;flex-shrink:0}
.per{font-family:var(--f-mono);font-size:12.5px;letter-spacing:1.8px;text-transform:uppercase;
color:var(--faint);margin:30px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border);
display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.per:first-child{margin-top:0}
.hero{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--accent);
border-radius:0 16px 16px 0;padding:22px 26px;margin-bottom:26px;
box-shadow:0 1px 3px rgba(40,42,41,.06)}
.hero .k{font-family:var(--f-mono);font-size:12px;letter-spacing:1.6px;text-transform:uppercase;
color:var(--accent);display:block;margin-bottom:8px}
.hero p{font-size:17px;color:var(--dim)}
.hero ul{margin:0;padding-left:22px;font-size:17px;color:var(--dim)}
.hero li{margin-bottom:6px}
.hero li:last-child{margin-bottom:0}
.foot{margin-top:44px;padding-top:22px;border-top:1px solid var(--border);
font-size:15px;color:var(--dim)}
.foot code{font-family:var(--f-mono);font-size:14px;background:var(--surf2);
border:1px solid var(--border);padding:2px 7px;border-radius:5px}
@media (max-width:640px){body{padding:24px 16px 44px}h1{font-size:2rem}
.card{padding:19px 20px}.rd{display:none}.hero{padding:18px 20px}}
</style>
</style>
</head>
