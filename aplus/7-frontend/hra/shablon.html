<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ЗАВДАННЯ 1 · заміни назву вкладки на назву своєї гри -->
<title>Моя гра</title>

<!-- ═══════════════════════════════════════════════════════════════════
     ШАБЛОН · порожня заготовка під власну гру
     Front-end II · 7 клас · A+

     Це каркас: він уже працює, але виглядає ніяк. Твоя робота —
     пройти завдання 1–7 і зробити з нього СВОЮ сторінку.
     Готові приклади, якщо забув, як щось пишеться: zmiyka.html і pazl.html
     Довідник усіх налаштувань: index.html

     Порядок роботи:
       1. збережи цей файл собі під своєю назвою
       2. поклади поруч gra.js (і картинку, якщо робиш пазл)
       3. відкрий через Live Server
       4. міняй по одному завданню й щоразу дивись, що змінилось
     ═══════════════════════════════════════════════════════════════════ -->

<style>
  /* ЗАВДАННЯ 2 · зроби сторінку своєю.
     Мінімум: свій колір фону, свій колір тексту, свій шрифт.
     Це той самий CSS, що на уроках 1–4 — нічого нового. */
  body {
    font-family: sans-serif;
    background: #ffffff;
    color: #000000;
    margin: 0;
    padding: 24px 16px;
    text-align: center;
  }

  /* ЗАВДАННЯ 3 · оформи заголовок: розмір, колір, відступи */
  h1 {
    font-size: 2rem;
  }

  /* ЗАВДАННЯ 4 · рамка навколо гри: border, border-radius,
     а хто хоче — box-shadow з уроку про тіні */
  #game {
    display: inline-block;
  }

  /* ЗАВДАННЯ 5 · оформи табло з рахунком */
  #табло {
    margin-top: 14px;
  }
</style>
</head>
<body>

  <!-- ЗАВДАННЯ 1 · впиши назву своєї гри і своє ім'я -->
  <h1>Моя гра</h1>
  <p>Автор: ______</p>

  <!-- Сюди рушій поставить гру. ЦЕЙ РЯДОК НЕ ЧІПАЙ -->
  <div id="game"></div>

  <!-- Табло. Текст усередині можна змінити -->
  <p id="табло">Рахунок: <b>0</b></p>

  <!-- ЗАВДАННЯ 6 · допиши сюди правила гри:
       що робити гравцеві, чим керувати, коли гра закінчується.
       Це звичайний HTML — <p>, <ul>, <li>, <b> -->


  <!-- Підключаємо рушій. ЦЕЙ РЯДОК НЕ ЧІПАЙ -->
  <script src="gra.js"></script>

  <script>
    // ═══ ЗАВДАННЯ 7 · тут описана твоя гра ═══
    //
    // Зараз стоїть найпростіша змійка. Зміни хоча б ТРИ налаштування:
    // розмір поля, швидкість, кольори, емодзі-їжу.
    // Повний список налаштувань — у index.html, розділ «Довідник».
    //
    // Хочеш пазл замість змійки? Прибери Game.snake({...}) цілком
    // і напиши замість нього:
    //     Game.puzzle({ image: 'моя-картинка.jpg', grid: 3 });

    Game.snake({
      field: 20,             // клітинок по стороні
      cell: 24,              // розмір клітинки, пікселів
      speed: 150,            // мілісекунд на крок: менше — швидше
      bgColor: '#101418',
      snakeColor: '#00e676',
      food: '🍎',

      onStart: function () {
        document.getElementById('табло').innerHTML = 'Рахунок: <b>0</b>';
      },

      onScore: function (score) {
        document.getElementById('табло').innerHTML =
          'Рахунок: <b>' + score + '</b>';
      },

      onGameOver: function (score) {
        document.getElementById('табло').innerHTML =
          'Гру закінчено. Рахунок: <b>' + score + '</b>';
      }
    });
  </script>

</body>
</html>
