<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змійка</title>

<!-- ═══════════════════════════════════════════════════════════════════

     Збережи цей файл собі, перейменуй і переробляй під себе.
     Усе, що треба міняти, позначено словом МІНЯЙ.
     ═══════════════════════════════════════════════════════════════════ -->

<style>
/* ─── МІНЯЙ: це звичайний CSS, який ти вже вмієш ─────────────────── */
body {
  font-family: 'Trebuchet MS', sans-serif;
  background: #0d1117;
  color: #e6edf3;
  margin: 0;
  padding: 30px 16px;
  text-align: center;
}
h1 {
  font-size: 2.4rem;
  margin: 0 0 6px;
  color: #00e676;
}
p.підпис {
  color: #8b949e;
  margin: 0 0 24px;
}
#gra {
  display: inline-block;
  border: 4px solid #00e676;
  border-radius: 14px;
  overflow: hidden;
}
#табло {
  margin-top: 18px;
  font-size: 1.3rem;
}
</style>
</head>
<body>

  <!-- ─── МІНЯЙ: заголовок і підпис ─────────────────────────────── -->
  <h1>Змійка Олександра</h1>
  <p class="підпис">Стрілки — керувати · пробіл — почати заново</p>

  <!-- Сюди рушій поставить гру. Цей рядок не чіпай. -->
  <div id="gra"></div>

  <p id="табло">Зібрано яблук: <b>0</b></p>

  <!-- Підключаємо рушій. Цей рядок не чіпай. -->
  <script src="gra.js"></script>

  <script>
    // ─── МІНЯЙ: тут описана вся твоя гра ──────────────────────────
    Гра.змійка({
      поле: 20,                  // клітинок по стороні поля
      клітинка: 24,              // розмір однієї клітинки, пікселів
      швидкість: 150,            // мілісекунд на крок: менше число — швидше
      кольорФону: '#101418',
      кольорЗмійки: '#00e676',
      кольорГолови: '#b9f6ca',   // голова світліша за тіло
      їжа: '🍎',                 // будь-яке емодзі; прибереш — буде квадрат
      кольорЇжі: '#ff5252',      // колір квадрата, якщо емодзі прибрано
      крізьСтіни: false,         // true — змійка виповзає з іншого боку

      // Спрацьовує на початку і після кожного перезапуску пробілом
      наПочаток: function () {
        document.getElementById('табло').innerHTML = 'Зібрано яблук: <b>0</b>';
      },

      // Спрацьовує щоразу, коли змійка з'їла яблуко
      наОчко: function (рахунок) {
        document.getElementById('табло').innerHTML =
          'Зібрано яблук: <b>' + рахунок + '</b>';
      },

      // Спрацьовує, коли гра закінчилась
      наКінець: function (рахунок) {
        document.getElementById('табло').innerHTML =
          'Гру закінчено. Яблук: <b>' + рахунок + '</b>';
      }
    });
  </script>

</body>
</html>
