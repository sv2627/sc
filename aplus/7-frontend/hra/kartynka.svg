<?xml version="1.0" encoding="UTF-8"?>
<!-- Зразкова картинка для пазла. Заміни її своєю: постав свій файл
     поруч і впиши його назву в налаштування картинка: '…' -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="0.55" stop-color="#7b3fa0"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="vohon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="1" stop-color="#ff5252"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#nebo)"/>

  <!-- зорі -->
  <g fill="#ffffff">
    <circle cx="70" cy="60" r="3.5"/>   <circle cx="180" cy="110" r="2.5"/>
    <circle cx="300" cy="45" r="3"/>    <circle cx="430" cy="95" r="2.5"/>
    <circle cx="520" cy="55" r="4"/>    <circle cx="120" cy="190" r="2.5"/>
    <circle cx="480" cy="200" r="3"/>   <circle cx="560" cy="150" r="2.5"/>
    <circle cx="240" cy="165" r="2"/>   <circle cx="380" cy="150" r="2"/>
  </g>

  <!-- планета з кільцем -->
  <ellipse cx="470" cy="145" rx="92" ry="22" fill="none" stroke="#ffd166" stroke-width="7" opacity=".85"/>
  <circle cx="470" cy="145" r="46" fill="#ffd166"/>
  <circle cx="455" cy="133" r="11" fill="#e0a83c" opacity=".7"/>
  <circle cx="486" cy="158" r="7" fill="#e0a83c" opacity=".7"/>

  <!-- сонце над обрієм -->
  <circle cx="140" cy="395" r="66" fill="#ffe066" opacity=".95"/>

  <!-- гори -->
  <path d="M0 470 L110 330 L205 450 L270 385 L370 470 Z" fill="#2b1a4d"/>
  <path d="M250 470 L360 320 L470 430 L530 375 L600 470 Z" fill="#3d2566"/>

  <!-- ракета -->
  <g transform="translate(300 300) rotate(18)">
    <path d="M0 -105 C34 -62 40 -8 34 40 L-34 40 C-40 -8 -34 -62 0 -105 Z" fill="#f5f5f5"/>
    <circle cx="0" cy="-32" r="19" fill="#2196f3" stroke="#0d47a1" stroke-width="5"/>
    <path d="M-34 8 L-70 58 L-34 44 Z" fill="#ef5350"/>
    <path d="M34 8 L70 58 L34 44 Z" fill="#ef5350"/>
    <path d="M-17 40 L0 104 L17 40 Z" fill="url(#vohon)"/>
  </g>

  <!-- земля -->
  <rect y="470" width="600" height="130" fill="#17102e"/>
  <path d="M0 470 Q150 440 300 470 T600 470 L600 520 L0 520 Z" fill="#241845"/>
  <g fill="#3d2566">
    <circle cx="80" cy="540" r="26"/>  <circle cx="300" cy="555" r="34"/>
    <circle cx="520" cy="535" r="22"/>
  </g>
</svg>
