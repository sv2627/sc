<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пазл</title>

<!-- ═══════════════════════════════════════════════════════════════════
     ГОТОВИЙ ПРИКЛАД «ПАЗЛ»
     Поклади свою картинку поруч із цим файлом і впиши її назву нижче.
     Усе, що треба міняти, позначено словом МІНЯЙ.
     ═══════════════════════════════════════════════════════════════════ -->

<style>
/* ─── МІНЯЙ: звичайний CSS ───────────────────────────────────────── */
body {
  font-family: 'Trebuchet MS', sans-serif;
  background: #f4f1ea;
  color: #2e2f2b;
  margin: 0;
  padding: 30px 16px;
  text-align: center;
}
h1 {
  font-size: 2.4rem;
  margin: 0 0 6px;
  color: #6a3d9a;
}
p.підпис { color: #6b6a64; margin: 0 0 24px; }

/* Плитки пазла — звичайні блоки в сітці. Твій CSS сильніший
   за стилі рушія, тому тут можна міняти все. */
.puzzle {
  margin: 0 auto;
  background: #6a3d9a;      /* колір швів між плитками */
  gap: 3px;                 /* товщина швів — як gap у Grid */
  border-radius: 16px;
}
.puzzle .tile {
  border-radius: 8px;
}
.puzzle .number {
  color: #fff;
}

button {
  margin-top: 20px;
  font: 600 17px 'Trebuchet MS', sans-serif;
  padding: 11px 26px;
  border: none;
  border-radius: 10px;
  background: #6a3d9a;
  color: #fff;
  cursor: pointer;
}
button:hover { background: #814cb8; }
#табло { margin-top: 16px; font-size: 1.2rem; min-height: 1.5em; }
</style>
</head>
<body>

  <!-- ─── МІНЯЙ: заголовок і підпис ─────────────────────────────── -->
  <h1>Пазл Олександра</h1>
  <p class="підпис">Клацай по плитці поруч із порожнім місцем</p>

  <!-- Сюди рушій поставить пазл. Цей рядок не чіпай. -->
  <div id="game"></div>

  <p id="табло"></p>
  <button onclick="Game.shufflePuzzle()">Перемішати заново</button>

  <!-- Підключаємо рушій. Цей рядок не чіпай. -->
  <script src="gra.js"></script>

  <script>
    // ─── МІНЯЙ: тут описаний увесь твій пазл ──────────────────────
    Game.puzzle({
      image: 'kartynka.svg',      // заміни на свій файл: 'foto.jpg', 'kit.png'…
      grid: 3,                    // 3 → пазл 3×3. Постав 4 — стане важче
      size: 420,                  // сторона пазла, пікселів
      showNumbers: true,          // false — сховати підказки-номери

      // Спрацьовує, коли пазл зібрано
      onWin: function (moves, seconds) {
        document.getElementById('табло').innerHTML =
          'Зібрано за <b>' + moves + '</b> ходів і <b>' + seconds + '</b> с!';
      }
    });
  </script>

</body>
</html>
